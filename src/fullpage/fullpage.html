<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TabVault — 全页管理</title>
  <link rel="stylesheet" href="fullpage.css" />
</head>
<body>
  <div id="custom-bg"></div>

  <div class="fp-app">

    <!-- 顶部导航 -->
    <header class="fp-header">
      <div class="fp-logo">
        <span class="fp-logo-icon">🗂️</span>
        <span class="fp-logo-text">TabVault</span>
        <div class="fp-stats">
          <span id="fp-stat-sessions">0 个会话</span>
          <span class="fp-stat-dot">·</span>
          <span id="fp-stat-tabs">0 个标签页</span>
        </div>
      </div>
      <div class="fp-header-center">
        <input id="fp-search" type="text" class="fp-search-input" placeholder="🔍 搜索会话..." />
      </div>
      <div class="fp-header-right">
        <button id="fp-btn-import" class="fp-btn fp-btn-ghost">⬆ 导入</button>
        <button id="fp-btn-export" class="fp-btn fp-btn-ghost">⬇ 导出</button>
        <button id="fp-btn-new" class="fp-btn fp-btn-primary">+ 新建会话</button>
      </div>
    </header>

    <!-- 主体：侧边栏 + 详情区 -->
    <div class="fp-body">

      <!-- 侧边栏 -->
      <aside class="fp-sidebar">
        <div class="fp-sidebar-header">
          <span id="fp-sidebar-title" class="fp-sidebar-title">全部会话</span>
          <span id="fp-session-count" class="fp-count-badge">0</span>
        </div>
        <div id="fp-session-list" class="fp-session-list"></div>
      </aside>

      <!-- 详情区 -->
      <main class="fp-main">
        <div id="fp-empty-detail" class="fp-empty-detail">
          <div class="fp-empty-icon">🗂️</div>
          <p id="fp-empty-hint">← 从左侧选择一个会话</p>
        </div>

        <div id="fp-detail" class="fp-detail hidden">
          <div class="fp-detail-header">
            <div class="fp-detail-title-row">
              <h2 id="fp-detail-name" class="fp-detail-name"></h2>
              <button id="fp-btn-rename" class="fp-icon-btn" title="重命名">✏️</button>
            </div>
            <div class="fp-detail-meta" id="fp-detail-meta"></div>
            <div class="fp-detail-actions">
              <button id="fp-btn-restore" class="fp-btn fp-btn-primary">▶ 恢复全部</button>
              <button id="fp-btn-share" class="fp-btn fp-btn-ghost">🔗 分享</button>
              <button id="fp-btn-delete" class="fp-btn fp-btn-danger">🗑 删除</button>
            </div>
          </div>

          <div id="fp-tabs-grid" class="fp-tabs-grid"></div>
        </div>
      </main>

    </div>
  </div>

  <!-- 删除确认 -->
  <div id="fp-confirm-modal" class="fp-modal hidden">
    <div class="fp-modal-backdrop"></div>
    <div class="fp-modal-box">
      <p id="fp-confirm-text">确定要删除这个会话吗？</p>
      <div class="fp-modal-actions">
        <button id="fp-modal-cancel" class="fp-btn fp-btn-ghost">取消</button>
        <button id="fp-modal-confirm" class="fp-btn fp-btn-danger">删除</button>
      </div>
    </div>
  </div>

  <!-- 分享弹窗 -->
  <div id="fp-share-modal" class="fp-modal hidden">
    <div class="fp-modal-backdrop"></div>
    <div class="fp-modal-box fp-modal-box--wide">
      <div class="fp-modal-header">
        <h3 id="fp-share-title">分享会话</h3>
        <button id="fp-share-close" class="fp-icon-btn">✕</button>
      </div>
      <p class="fp-modal-desc">将以下「分享码」发送给对方，对方在 TabVault 点击「导入」粘贴即可一键还原所有标签页。</p>
      <div id="fp-share-urls" class="fp-share-urls"></div>
      <textarea id="fp-share-code" class="fp-share-code" readonly></textarea>
      <div class="fp-modal-actions">
        <button id="fp-copy-code" class="fp-btn fp-btn-primary">📋 复制分享码</button>
        <button id="fp-copy-urls" class="fp-btn fp-btn-ghost">🔗 复制链接列表</button>
      </div>
    </div>
  </div>

  <!-- 导入弹窗 -->
  <div id="fp-import-modal" class="fp-modal hidden">
    <div class="fp-modal-backdrop"></div>
    <div class="fp-modal-box fp-modal-box--wide">
      <div class="fp-modal-header">
        <h3>导入会话</h3>
        <button id="fp-import-close" class="fp-icon-btn">✕</button>
      </div>
      <p class="fp-modal-desc">粘贴分享码，或从本地 JSON 备份文件导入。</p>
      <textarea id="fp-import-code" class="fp-share-code" placeholder="在此粘贴分享码..."></textarea>
      <div id="fp-import-error" class="fp-import-error hidden">无效的分享码或文件，请检查后重试</div>
      <div class="fp-modal-actions fp-modal-actions--col">
        <button id="fp-do-import" class="fp-btn fp-btn-primary" style="flex:1">⬆ 导入分享码</button>
        <label class="fp-btn fp-btn-ghost" for="fp-import-file" style="flex:1;justify-content:center;cursor:pointer;">
          📁 从本地文件导入
          <input type="file" id="fp-import-file" accept=".json" class="fp-hidden" />
        </label>
      </div>
    </div>
  </div>

  <script src="../i18n.js"></script>
  <script src="fullpage.js"></script>
</body>
</html>
